<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <title>Scale Trainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <h1>Scale Trainer</h1>
    <div class="settings">
      <div class="seg" id="modeSeg" role="radiogroup" aria-label="Scale type">
        <button data-val="major">Major</button>
        <button data-val="minor">Minor</button>
      </div>
      <div class="seg" id="handSeg" role="radiogroup" aria-label="Hand">
        <button data-val="right">Right</button>
        <button data-val="left">Left</button>
        <button data-val="both">Both</button>
      </div>
      <div class="seg" id="octSeg" role="radiogroup" aria-label="Octaves">
        <button data-val="1">1 oct</button>
        <button data-val="2">2 oct</button>
      </div>
      <label class="select">
        <span>Order</span>
        <select id="orderSel">
          <option value="fifths">Circle of 5ths</option>
          <option value="chromatic">Chromatic</option>
          <option value="random">Random</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="strictChk"> Strict</label>
    </div>
  </header>

  <main>
    <section class="card" id="card">
      <div class="keynav">
        <button class="icon" id="prevBtn" aria-label="Previous key">‹</button>
        <h2 id="keyName">C Major</h2>
        <button class="icon" id="nextBtn" aria-label="Next key">›</button>
      </div>

      <button class="reveal" id="sigBtn">Tap to reveal key signature</button>
      <div class="sig" id="sig" hidden></div>

      <div class="progress" id="progress" aria-live="polite"></div>
      <p class="msg" id="msg"></p>

      <div class="row">
        <button class="reveal small" id="fingerBtn">Show fingerings</button>
        <button class="reveal small" id="restartBtn">Restart</button>
      </div>
      <div class="fingerings" id="fingerings" hidden></div>

      <p class="stats" id="stats"></p>
    </section>

    <section class="input">
      <div class="midi" id="midiStatus"><span class="dot"></span><span id="midiText">Checking for MIDI…</span></div>
      <button class="reveal small" id="kbBtn">Show keyboard</button>
    </section>
    <div class="kb-scroll" id="kbWrap" hidden><div id="keyboard"></div></div>
  </main>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
